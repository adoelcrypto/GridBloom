<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="36" fill="#0B0F19"/>
  <rect x="24" y="24" width="144" height="144" rx="20" fill="#131B2E" stroke="#1E293B" stroke-width="2"/>
  
  <!-- 4-petal bloom block formation -->
  <!-- Top petal (cyan) -->
  <rect x="76" y="44" width="40" height="40" rx="8" fill="#06B6D4" stroke="#22D3EE" stroke-width="2"/>
  <!-- Left petal (coral) -->
  <rect x="44" y="76" width="40" height="40" rx="8" fill="#F43F5E" stroke="#FB7185" stroke-width="2"/>
  <!-- Right petal (emerald) -->
  <rect x="108" y="76" width="40" height="40" rx="8" fill="#10B981" stroke="#34D399" stroke-width="2"/>
  <!-- Bottom petal (amber) -->
  <rect x="76" y="108" width="40" height="40" rx="8" fill="#F59E0B" stroke="#FBBF24" stroke-width="2"/>
  <!-- Center bloom spark (violet/gold) -->
  <circle cx="96" cy="96" r="10" fill="#A855F7" stroke="#E9D5FF" stroke-width="2"/>
</svg>
